<!doctype html>
<html lang="zh-CN" data-theme="claude" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' file:; script-src 'self' file:; img-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>邮件 · Huhu 工作台</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <header class="titlebar row spread"><div class="row"><span class="brand" aria-hidden="true">H</span><strong>Huhu</strong></div><span class="sub">演示 Vault</span></header>
  <div class="shell">
    <nav class="rail" aria-label="工作台模块">
      <button class="quiet" type="button" data-action="module" aria-current="page" aria-label="邮件">✉</button>
      <button class="quiet" type="button" data-action="settings" aria-label="邮件设置">⚙</button>
    </nav>
    <div class="workbench">
      <nav class="tabs" aria-label="工作台标签"><button class="quiet" type="button" data-action="module" aria-current="page">邮件</button></nav>
      <div class="crumb row spread"><span>演示 Vault <span aria-hidden="true">›</span> <b id="crumb">邮件</b></span>
        <div class="row"><select id="theme" aria-label="工作台主题"><option value="notion">Notion</option><option value="claude" selected>Claude</option><option value="apple">Apple</option><option value="vercel">Vercel</option></select><button type="button" data-action="theme-mode">深色</button></div>
      </div>
      <div class="status" id="status" role="status"></div>
      <main id="main"></main><section id="composer" aria-label="写信" hidden></section>
      <div>
        <details class="demo"><summary>演示控制 · 使用模拟数据</summary><div class="row"><label>下一操作 <select id="fault" aria-label="邮件故障场景"><option value="">正常</option><option value="connect">连接超时</option><option value="oauth">OAuth 授权拒绝</option><option value="body">正文载入失败</option><option value="read">远端标读失败</option><option value="draft">草稿保存失败</option><option value="failed">明确未投递</option><option value="partial">部分收件人接受</option><option value="unknown">投递结果未知</option><option value="backup">备份校验失败</option><option value="ai">AI 服务暂不可用</option></select></label><button type="button" data-action="offline" aria-pressed="false">模拟离线</button><button type="button" data-action="readonly" aria-pressed="false">模拟只读 Vault</button><button type="button" data-action="notification-demo">定位通知样例</button><button type="button" data-action="restart">模拟重启</button><button type="button" data-action="reset">重置演示</button></div></details>
        <footer class="footer">Huhu 工作台 · 邮件 · 界面待确认</footer>
      </div>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title">
    <div class="row spread section-head"><h2 id="modal-title" tabindex="-1"></h2><button type="button" class="quiet" data-action="close-modal" aria-label="关闭对话框">×</button></div>
    <div id="modal-body"></div>
  </dialog>
</body>
</html>
