name: herdr-core
# 从固定提交编译 Herdr Core（需要 Zig 0.16 与 ghostty 子模块），三个目标各一份，作为 artifact 供发布流程下载。
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, dir: win32-x64, exe: herdr-core.exe }
          - { os: macos-14, dir: darwin-arm64, exe: herdr-core }
          - { os: ubuntu-22.04, dir: linux-x64, exe: herdr-core }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 读取固定提交
        id: src
        shell: bash
        run: |
          echo "repo=$(node -p "require('./scripts/herdr-source.json').repo")" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./scripts/herdr-source.json').commit")" >> "$GITHUB_OUTPUT"
          echo "zig=$(node -p "require('./scripts/herdr-source.json').zig")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: herdrdev/herdr-core
          ref: ${{ steps.src.outputs.commit }}
          submodules: recursive
          path: herdr-core
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.src.outputs.zig }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        working-directory: herdr-core
      - name: 冒烟：启动、server.status、停止
        shell: bash
        working-directory: herdr-core
        run: |
          export HC_SESSION=ci XDG_STATE_HOME="$PWD/.state" XDG_CONFIG_HOME="$PWD/.config"
          ./target/release/${{ matrix.exe }} server start
          ./target/release/${{ matrix.exe }} server status
          ./target/release/${{ matrix.exe }} server stop
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-${{ matrix.dir }}
          path: herdr-core/target/release/${{ matrix.exe }}
