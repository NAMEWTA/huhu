name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Herdr Core（下载并校验；失败即中止，不能让真实 Herdr 用例被静默跳过）
        run: node scripts/fetch-herdr.mjs
      - name: 记录 HUHU_HERDR_BIN
        shell: bash
        run: |
          bin="$(node scripts/fetch-herdr.mjs --print-path)"
          test -n "$bin"
          test -f "$bin"
          echo "HUHU_HERDR_BIN=$bin" >> "$GITHUB_ENV"
      - run: pnpm lint
      - if: runner.os == 'Linux'
        run: pnpm knip # 未使用的文件/依赖/导出；与平台无关，只在 Linux 跑一次
      - if: runner.os == 'Linux'
        run: pnpm format:check # 格式化与平台无关，只在 Linux 检查一次
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e
      - if: runner.os != 'Linux'
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ matrix.os }}
          path: test-results
