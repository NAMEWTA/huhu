name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: runner.os == 'Linux'
        run: node scripts/check-development-evidence.mjs
      - run: pnpm install --frozen-lockfile
      - name: Herdr Core（下载并校验；失败即中止，不能让真实 Herdr 用例被静默跳过）
        run: node scripts/fetch-herdr.mjs
      - name: 记录 HUHU_HERDR_BIN
        shell: bash
        run: |
          bin="$(node scripts/fetch-herdr.mjs --print-path)"
          test -n "$bin"
          test -f "$bin"
          echo "HUHU_HERDR_BIN=$bin" >> "$GITHUB_ENV"
      - run: pnpm lint
      - if: runner.os == 'Linux'
        run: pnpm knip # 未使用的文件/依赖/导出；与平台无关，只在 Linux 跑一次
      - if: runner.os == 'Linux'
        run: pnpm format:check # 格式化与平台无关，只在 Linux 检查一次
      - if: runner.os == 'Linux'
        run: node scripts/sync-version.mjs --check # 各包版本与根 package.json 一致
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version-file: native/agent-pty/go.mod
          cache: false
      - if: runner.os == 'Linux'
        name: Linux 旅程前置（Playwright Chromium、原生 PTY helper、固定 Codex、Secret Service）
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends gnome-keyring
          native/agent-pty/build.sh
          dir="$RUNNER_TEMP/codex-0.170.0"
          mkdir -p "$dir"
          curl -fsSL https://github.com/openai/codex/releases/download/rust-v0.170.0/codex-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$dir"
          echo "880819aab735adcf16f36cd628940b9f1e652a36c01d10a5d32f83cc84902971  $dir/codex-x86_64-unknown-linux-musl" | sha256sum -c -
          codex="$dir/codex-x86_64-unknown-linux-musl"
          {
            echo "HUHU_AGENT_PTY_HOST=$PWD/native/agent-pty/bin/huhu-agent-pty"
            echo "HUHU_AGENT_LAUNCH_TEST_BIN=$HUHU_HERDR_BIN"
            echo "HUHU_CODEX_DISPATCH_BIN=$codex"
            echo "HUHU_CODEX_NATIVE_TEST_BIN=$codex"
            echo "HUHU_P6_CODEX_BIN=$codex"
            if [ -x /usr/sbin/sshd ]; then echo "HUHU_TEST_OPENSSH_SSHD=/usr/sbin/sshd"; fi
            echo "HUHU_MCP_KEYRING_ACCEPTANCE=1"
          } >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        # 凭据走 Secret Service：在独立 D-Bus 会话里解锁一个临时 login 钥匙串，随会话退出。
        run: dbus-run-session -- bash -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && exec xvfb-run -a pnpm e2e --reporter=list,json'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/journeys.json
      - if: runner.os != 'Linux'
        run: pnpm e2e --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/journeys.json
      - if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-${{ github.sha }}-${{ matrix.os }}
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  test-vendor:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ok-patches.mjs --check-vendor-directories
      - run: pnpm test:vendor
