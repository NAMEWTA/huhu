name: release
on:
  workflow_dispatch:
jobs:
  herdr:
    uses: ./.github/workflows/herdr.yml
  package:
    needs: herdr
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: win32-x64 }
          - { os: macos-14, target: darwin-arm64 }
          - { os: ubuntu-22.04, target: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: herdr-${{ matrix.target }}
          path: apps/desktop/resources/herdr/${{ matrix.target }}
      - run: chmod +x apps/desktop/resources/herdr/${{ matrix.target }}/herdr-core || true
        shell: bash
      - run: pnpm build
      - run: pnpm --filter @huhu/desktop exec electron-builder
      - run: node scripts/checksums.mjs apps/desktop/release ${{ matrix.target }}
      - name: 冒烟（Linux）
        if: runner.os == 'Linux'
        run: sh scripts/smoke-linux.sh apps/desktop/release/HUHU-*-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: HUHU-${{ matrix.target }}
          path: apps/desktop/release/*
