name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: win32-x64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: ubuntu-22.04, target: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node scripts/sync-version.mjs --check
      - run: node scripts/fetch-herdr.mjs --target ${{ matrix.target }} # 官方发布包，校验 SHA-256；不符则失败
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm notices
      - run: pnpm build
      - run: pnpm --filter @huhu/desktop exec electron-builder --publish never
      - run: node scripts/checksums.mjs apps/desktop/release ${{ matrix.target }}
      - name: 冒烟（Linux）
        if: runner.os == 'Linux'
        run: sh scripts/smoke-linux.sh apps/desktop/release/HUHU-*-linux-x64.AppImage
      - name: 命令行冒烟（Linux）
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/apps/desktop/release/HUHU-*-linux-x64.AppImage --appimage-extract >/dev/null
          sh "$GITHUB_WORKSPACE/scripts/smoke-cli.sh" "$RUNNER_TEMP/squashfs-root" "$(node -p "require('$GITHUB_WORKSPACE/apps/desktop/package.json').version")"
      - name: 打包后 E2E 子集（Linux）
        if: runner.os == 'Linux'
        run: |
          exe="$(find apps/desktop/release/linux-unpacked -maxdepth 1 -type f -iname 'huhu' | head -1)"
          test -n "$exe"
          HUHU_PACKAGED_EXE="$PWD/$exe" xvfb-run -a pnpm e2e:packaged # 不设 HUHU_HERDR_BIN：必须用随包的 Herdr Core
      - name: 打包后 E2E 子集（macOS）
        if: runner.os == 'macOS'
        run: HUHU_PACKAGED_EXE="$PWD/apps/desktop/release/mac-arm64/HUHU.app/Contents/MacOS/HUHU" pnpm e2e:packaged
      - name: 打包后 E2E 子集（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: HUHU_PACKAGED_EXE="$PWD/apps/desktop/release/win-unpacked/HUHU.exe" pnpm e2e:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: HUHU-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/SHA256SUMS-*.txt

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: HUHU-*
          merge-multiple: true
      - name: 合并校验和
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          sha256sum -c SHA256SUMS.txt
      - name: 创建 Release 草稿（人工审阅后发布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac # v0.0.1-rc.1 这样带后缀的标签是预发布
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --draft $pre --title "HUHU ${GITHUB_REF_NAME}" \
            --notes "未签名安装包。Windows SmartScreen 选择“仍要运行”；macOS 首次打开右键“打开”或执行 xattr -dr com.apple.quarantine /Applications/HUHU.app；Linux AppImage 需 chmod +x。校验：sha256sum -c SHA256SUMS.txt。"
