appId: dev.huhu.workbench
productName: HUHU
directories:
  output: release
beforePack: scripts/before-pack.cjs
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bin
    to: bin
  - from: ../cli/dist/cli.mjs
    to: cli/cli.mjs
  - from: resources/herdr/${platform}-${arch}
    to: herdr/${platform}-${arch}
    filter: ["**/*"]
  - from: resources/demo-vault
    to: demo-vault
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  target: [{ target: nsis, arch: x64 }]
  artifactName: HUHU-${version}-win32-x64.${ext}
mac:
  target: [{ target: dmg, arch: arm64 }]
  identity: null
  artifactName: HUHU-${version}-darwin-arm64.${ext}
linux:
  target: [{ target: AppImage, arch: x64 }, { target: deb, arch: x64 }]
  artifactName: HUHU-${version}-linux-x64.${ext}
  category: Office
  executableName: huhu
  maintainer: HUHU
publish: null
