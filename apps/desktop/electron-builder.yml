appId: dev.huhu.workbench
productName: HUHU
directories:
  output: release
icon: ../../assets/brand/huhu-icon-1024.png
beforePack: scripts/before-pack.cjs
npmRebuild: false # 没有需要针对 Electron ABI 编译的模块（@parcel/watcher 用预编译包；ssh2 的原生加速可选）
asarUnpack:
  - "**/keyring.*.node"
files:
  - out/**
  - package.json
  - "!**/*.{test,spec,test-helper,test-helpers}.*"
  - "!**/{__tests__,__fixtures__,test-utils,test-results,test,tests}/**"
  - "!**/open-knowledge/**/{test,tests,fixtures}/**"
extraResources:
  - from: ../../plugins/agent-cli/src/engine/codex-dispatch-helper.cjs
    to: codex-dispatch/helper.cjs
  - from: ../../plugins/agent-cli/src/engine/protected-launch-helper.cjs
    to: protected-launch/helper.cjs
  - from: resources/bin
    to: bin
  - from: ../cli/dist/cli.mjs
    to: cli/cli.mjs
  - from: resources/herdr/${platform}-${arch}
    to: herdr/${platform}-${arch}
    filter: ["**/*"]
  - from: resources/demo-vault
    to: demo-vault
  - from: ../../examples/plugins
    to: plugins
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  extraResources:
    - from: ../../native/agent-pty/bin/huhu-agent-pty.exe
      to: agent-pty/huhu-agent-pty.exe
    - from: ../../native/agent-pty
      to: agent-pty/licenses
      filter: ["LICENSE-*.txt", "PATENTS-*.txt"]
  target: [{ target: nsis, arch: x64 }]
  artifactName: HUHU-${version}-win32-x64.${ext}
nsis:
  oneClick: false
  perMachine: false # oneClick:false + perMachine:false → 向导里出现“仅为我 / 所有人”安装范围页
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HUHU
  runAfterFinish: true
  installerLanguages: [zh_CN] # 只插入简体中文；不要设置 multiLanguageInstaller:false（会固定为英文）
  language: "2052" # 只影响 exe 版本资源的语言字段
mac:
  target: [{ target: dmg, arch: arm64 }]
  identity: null
  artifactName: HUHU-${version}-darwin-arm64.${ext}
linux:
  extraResources:
    - from: ../../native/agent-pty/bin/huhu-agent-pty
      to: agent-pty/huhu-agent-pty
    - from: ../../native/agent-pty
      to: agent-pty/licenses
      filter: ["LICENSE-*.txt", "PATENTS-*.txt"]
  target: [{ target: AppImage, arch: x64 }, { target: deb, arch: x64 }]
  artifactName: HUHU-${version}-linux-x64.${ext}
  category: Office
  executableName: huhu
  maintainer: HUHU
publish: null
